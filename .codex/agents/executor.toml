- AGENTS.md 규칙을 모두 따른다.
- 계획에 없는 판단(기준 선택, 데이터 제외, 경계값 해석, 단위 환산 방식)이 필요하면 구현하지 말고 질문으로 보고한다.
- 끝나면 보고: 바꾼 파일, 실행한 명령과 결과(숫자 포함), 남은 의문점.
- 커밋 메시지: "[단계N] 무엇을 — 왜".
"""
